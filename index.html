<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Box Log</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#9a5b1f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f2ef;--fg:#1d1b18;--card:#fff;--line:#d8d4cc;--ac:#9a5b1f;--mut:#6b655b}
@media(prefers-color-scheme:dark){:root{--bg:#141311;--fg:#ece9e3;--card:#201e1b;--line:#3a3631;--ac:#c4833f;--mut:#a39c90}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:env(safe-area-inset-top) 0 calc(66px + env(safe-area-inset-bottom))}
main{padding:12px;max-width:900px;margin:auto}
input,select,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--card);min-width:0}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}
button.g{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:400}
button:disabled{opacity:.4}
.r{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}.r>*{flex:1 1 auto}.r .n{flex:0 0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:13px;padding:13px 2px;font-weight:400}
nav .on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
tr.s{background:color-mix(in srgb,var(--ac) 22%,transparent)}
img.t{width:44px;height:44px;object-fit:cover;border-radius:6px;display:block}
.w{overflow-x:auto}.m{color:var(--mut);font-size:14px}.h{opacity:.55}
.bn{background:color-mix(in srgb,var(--ac) 18%,transparent);padding:10px;border-radius:8px;margin-bottom:8px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;max-width:90vw}
dialog{width:min(92vw,460px);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
dialog label{display:block;margin:8px 0 2px;font-size:14px}dialog input{width:100%}
</style></head><body>
<main id="v"></main><nav id="nav"></nav><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID(),fmt=n=>String(+n),today=()=>new Date().toLocaleDateString('en-CA');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
let db,tab='pick',S={projects:[],items:[],picks:[],photos:{}},P={q:'',sel:null,qty:'1',only:null,date:'',dd:'',proj:''},B={proj:'',a:'',b:''};
const ST=['projects','items','picks','photos'];
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('boxlog8',1);r.onupgradeneeded=()=>ST.forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=db.transaction(s,m),r=f(t);t.oncomplete=()=>ok(r&&r.result);t.onerror=no});
const all=s=>tx(s,'readonly',t=>t.objectStore(s).getAll()),put=(s,o)=>tx(s,'readwrite',t=>t.objectStore(s).put(o)),del=(s,id)=>tx(s,'readwrite',t=>t.objectStore(s).delete(id));
const projOK=()=>S.projects.some(p=>p.id==P.proj),lastName=()=>(S.projects.find(p=>p.id==P.proj)||{}).name||'';
const setDate=()=>{P.date=P.dd=today()};
const TABS=[['pick','Pick Items'],['box','Picked List'],['items','Item List'],['proj','Projects'],['bak','Backup']];
function go(t){tab=t;if(t=='box'){B.a=B.b=today();if(!bProjs().includes(B.proj))B.proj=lastName()}if(t=='pick'&&P.date==P.dd)setDate();render()}
function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" data-go="${k}">${l}</button>`).join('');
  const old=S.picks.length&&(!ls('bk')||Date.now()-new Date(ls('bk'))>30*864e5);
  $('#v').innerHTML=(old?'<div class="bn">It has been a while. Open Backup and save a copy of your data.</div>':'')+{pick:vPick,box:vBox,items:vItems,proj:vProj,bak:vBak}[tab]();
  if(tab=='pick'){$('#g').innerHTML=grid();upd()}
}
/* ---------- Pick Items ---------- */
function vPick(){return `<div class="r"><select id="pj"><option value="">${S.projects.length?'Choose a project…':'No projects yet'}</option>${S.projects.map(p=>`<option value="${p.id}" ${p.id==P.proj?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="+">+ Add a project…</option></select><input type="date" id="pd" value="${P.date}"></div>
<input id="sq" placeholder="Search items" value="${esc(P.q)}" style="width:100%" autocomplete="off">
<div class="r"><button class="g n" data-a="mn">−</button><input id="qt" inputmode="decimal" value="${esc(P.qty)}" style="max-width:90px;text-align:center"><button class="g n" data-a="pl">+</button><button id="sv" data-a="save">Save</button></div>
<div class="w" id="g"></div>`}
function vis(){const q=P.q.trim().toLowerCase();return S.items.filter(i=>!i.hist&&(P.only?i.id==P.only:!q||[i.category,i.item,i.mfr,i.count,i.weight].some(v=>String(v).toLowerCase().includes(q))))}
function grid(){const v=vis();if(P.sel&&!v.some(i=>i.id==P.sel))P.sel=null;
  if(!v.length)return `<p class="m">No items found.</p><button data-a="new">Add new item</button>`;
  return `<table><tr><th>Category<th>Item<th>Manufacturer<th>Count<th>Weight<th></tr>${v.map(i=>`<tr data-sel="${i.id}" class="${i.id==P.sel?'s':''}"><td>${esc(i.category)}<td>${esc(i.item)}<td>${esc(i.mfr)}<td>${esc(i.count)}<td>${esc(i.weight)}<td>${i.photo&&S.photos[i.photo]?`<img class="t" src="${S.photos[i.photo]}">`:''}</tr>`).join('')}</table>`}
function upd(){const s=$('#sv');if(s)s.disabled=!(P.sel&&projOK()&&+P.qty>0)}
/* ---------- Item form ---------- */
function dItem(it,pre){const x=it||{item:pre||''},d=$('#dlg');
  d.innerHTML=`<form id="fi"><h3>${it?'Edit item':'New item'}</h3>
<label>Category</label><input name="category" required value="${esc(x.category)}">
<label>Item</label><input name="item" required value="${esc(x.item)}">
<label>Manufacturer</label><input name="mfr" required list="ml" autocomplete="off" value="${esc(x.mfr)}"><datalist id="ml"></datalist>
<label>Item Count (pieces in a box)</label><input name="count" required inputmode="decimal" value="${esc(x.count)}">
<label>Item Weight (one piece, like 8 oz)</label><input name="weight" required value="${esc(x.weight)}">
<label>Photo ${it&&it.photo?'(choose a new one to replace the current photo)':''}</label>${it&&it.photo&&S.photos[it.photo]?`<img class="t" src="${S.photos[it.photo]}">`:''}<input type="file" name="ph" accept="image/*">
<div class="r"><button type="button" class="g" data-a="cx">Cancel</button><button>Save item</button></div></form>`;
  d.dataset.id=it?it.id:'';d.showModal()}
const shrink=f=>new Promise(ok=>{const i=new Image();i.onload=()=>{const s=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});
async function dropPhoto(pid){for(const k of S.picks)if(k.photo==pid){k.photo=null;await put('picks',k)}delete S.photos[pid];await del('photos',pid)}
document.addEventListener('submit',async e=>{if(e.target.id!='fi')return;e.preventDefault();
  const d=$('#dlg'),id=d.dataset.id,fd=new FormData(e.target),o={...(S.items.find(i=>i.id==id)||{id:uid(),hist:false,photo:null})};
  ['category','item','mfr','count','weight'].forEach(k=>o[k]=fd.get(k).trim());
  const f=fd.get('ph'),np=f&&f.size?await shrink(f):null;
  if(id&&o.photo){const keep=np?false:confirm('Is the photo still correct?\n\nOK = Yes, keep it\nCancel = No (it will be removed unless you chose a new one)');if(!keep){await dropPhoto(o.photo);o.photo=null}}
  if(np){const pid=uid();S.photos[pid]=np;await put('photos',{id:pid,data:np});o.photo=pid}
  const k=S.items.findIndex(i=>i.id==o.id);k<0?S.items.push(o):S.items[k]=o;await put('items',o);d.close();
  if(!id&&tab=='pick'){P.q='';P.only=o.id;P.sel=o.id;P.qty='1'}render()});
/* ---------- Picked List ---------- */
const bProjs=()=>[...new Set([...S.projects.map(p=>p.name),...S.picks.map(k=>k.project)])].sort();
const rows=()=>S.picks.filter(k=>k.project==B.proj&&k.pDate>=B.a&&k.pDate<=B.b).sort((x,y)=>x.pDate.localeCompare(y.pDate)||x.savedAt.localeCompare(y.savedAt));
const H=['Project Date','Category','Item','Manufacturer','Item Count','Item Weight','Quantity'];
const cells=k=>[k.pDate,k.category,k.item,k.mfr,k.count,k.weight,fmt(k.qty)].map(v=>String(v).replace(/[\t\r\n]+/g,' '));
const tsv=()=>[H,...rows().map(cells)].map(r=>r.join('\t')).join('\n');
const fixed=()=>{const t=[H,...rows().map(cells)],w=H.map((_,i)=>Math.max(...t.map(r=>r[i].length)));return t.map(r=>r.map((c,i)=>c.padEnd(w[i])).join('  ')).join('\n')};
const total=r=>+r.reduce((a,k)=>a+k.qty,0).toFixed(4);
function vBox(){const r=rows();
  return `<div class="r"><select id="bp">${bProjs().map(n=>`<option ${n==B.proj?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
<div class="r"><input type="date" id="ba" value="${B.a}"><input type="date" id="bb" value="${B.b}"></div>
<p><b>Total quantity: ${fmt(total(r))}</b> <span class="m">(${r.length} picks)</span></p>
<div class="r"><button data-a="cs">Copy for spreadsheet</button><button data-a="cf">Copy as fixed width</button><button data-a="em">Send as email</button></div>
<div class="w"><table><tr><th>Date<th>Category<th>Item<th>Manufacturer<th>Count<th>Weight<th>Qty<th><th></tr>${r.map(k=>`<tr><td>${k.pDate}<td>${esc(k.category)}<td>${esc(k.item)}<td>${esc(k.mfr)}<td>${esc(k.count)}<td>${esc(k.weight)}<td>${fmt(k.qty)}<td>${k.photo&&S.photos[k.photo]?`<img class="t" src="${S.photos[k.photo]}">`:''}<td style="white-space:nowrap"><button class="g n" data-a="ek" data-id="${k.id}">Edit</button> <button class="g n" data-a="dk" data-id="${k.id}">Delete</button></tr>`).join('')}</table></div>`}
async function out(f){if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name=='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
const copy=t=>navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Could not copy'));
async function email(){const r=rows();if(!r.length)return toast('Nothing to send');
  const rng=B.a==B.b?B.a:`${B.a} to ${B.b}`,subj=`${B.proj}, ${rng}`;
  const html=`<div style="font-family:Arial,sans-serif"><h2>${esc(B.proj)}</h2><p>${rng}. Total quantity: ${fmt(total(r))}</p>`+r.map(k=>`<table style="margin:0 0 14px;border-collapse:collapse"><tr>${k.photo&&S.photos[k.photo]?`<td style="width:120px;padding-right:12px;vertical-align:top"><img src="${S.photos[k.photo]}" width="120" style="display:block"></td>`:''}<td style="vertical-align:top;font-size:15px;line-height:1.5">${[['Category',k.category],['Item',k.item],['Manufacturer',k.mfr],['Item Count',k.count],['Item Weight',k.weight],['Quantity',fmt(k.qty)],['Project Date',k.pDate]].map(([a,b])=>`<b>${a}:</b> ${esc(b)}`).join('<br>')}</td></tr></table>`).join('')+'</div>';
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([fixed()],{type:'text/plain'})})]);toast('Your list is ready. Paste it into the message.');setTimeout(()=>location.href='mailto:?subject='+encodeURIComponent(subj),900)}
  catch(e){out(new File([html],'picked-list.html',{type:'text/html'}))}}
/* ---------- Items, Projects, Backup ---------- */
function vItems(){return `<div class="r"><button data-a="new2">Add item</button></div><div class="w"><table><tr><th>Category<th>Item<th>Manufacturer<th>Count<th>Weight<th><th></tr>${S.items.map(i=>`<tr class="${i.hist?'h':''}"><td>${esc(i.category)}<td>${esc(i.item)}${i.hist?' (historical)':''}<td>${esc(i.mfr)}<td>${esc(i.count)}<td>${esc(i.weight)}<td>${i.photo&&S.photos[i.photo]?`<img class="t" src="${S.photos[i.photo]}">`:''}<td style="white-space:nowrap"><button class="g n" data-a="ei" data-id="${i.id}">Edit</button> <button class="g n" data-a="hi" data-id="${i.id}">${i.hist?'Restore':'Historical'}</button> <button class="g n" data-a="di" data-id="${i.id}">Delete</button></tr>`).join('')}</table></div>`}
function vProj(){return `<div class="r"><input id="np" placeholder="New project name"><button class="n" data-a="ap">Add</button></div>`+S.projects.map(p=>`<div class="r"><span>${esc(p.name)}</span><button class="g n" data-a="rp" data-id="${p.id}">Rename</button><button class="g n" data-a="dp" data-id="${p.id}">Delete</button></div>`).join('')}
function vBak(){return `<p>Save a backup often. A phone can clear this app's data without warning.</p><p class="m">Last backup: ${ls('bk')||'never'}</p><div class="r"><button data-a="bk">Save a backup</button></div>
<p class="m">Restore from a backup file (replaces everything now in the app):</p><input type="file" id="rf" accept=".json" style="width:100%">
<p class="m">To install: on iPhone tap Share, then Add to Home Screen. On Android tap the menu, then Install app.</p>`}
async function restore(f){if(!f)return;try{const j=JSON.parse(await f.text());if(j.v!=8)throw 0;if(!confirm('This replaces everything now in the app with the backup. Continue?'))return;
  S.projects=j.projects;S.items=j.items;S.picks=j.picks;S.photos=j.photos;
  await Promise.all([['projects',S.projects],['items',S.items],['picks',S.picks],['photos',Object.entries(S.photos).map(([id,data])=>({id,data}))]].map(([s,a])=>tx(s,'readwrite',t=>{const o=t.objectStore(s);o.clear();a.forEach(x=>o.put(x))})));
  toast('Backup restored');render()}catch(e){toast('That file is not a Box Log backup')}}
/* ---------- Events ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-a],[data-sel]');if(!t)return;const D=t.dataset,id=D.id;
  if(D.go)return go(D.go);
  if(D.sel){P.sel=D.sel;$('#g').innerHTML=grid();return upd()}
  switch(D.a){
  case'mn':case'pl':{const q=parseFloat(P.qty)||1;if(D.a=='pl')P.qty=fmt(Math.floor(q)+1);else if(Math.ceil(q)-1>=1)P.qty=fmt(Math.ceil(q)-1);$('#qt').value=P.qty;upd();break}
  case'save':{const pr=S.projects.find(p=>p.id==P.proj),it=S.items.find(i=>i.id==P.sel);if(!pr||!it)break;
    const o={id:uid(),savedAt:new Date().toISOString(),pDate:P.date,project:pr.name,category:it.category,item:it.item,mfr:it.mfr,count:it.count,weight:it.weight,photo:it.photo||null,qty:+P.qty};
    S.picks.push(o);await put('picks',o);ls('lp',P.proj);P.sel=null;P.qty='1';P.only=null;setDate();toast('Saved');render();break}
  case'new':dItem(null,P.q.trim());break;
  case'new2':dItem(null);break;
  case'cx':$('#dlg').close();break;
  case'ei':dItem(S.items.find(i=>i.id==id));break;
  case'hi':{const i=S.items.find(x=>x.id==id);i.hist=!i.hist;await put('items',i);render();break}
  case'di':{if(!confirm('Delete this item? Past picks will keep their details but lose the photo.'))break;const i=S.items.find(x=>x.id==id);S.items=S.items.filter(x=>x!=i);await del('items',id);if(i.photo)await dropPhoto(i.photo);render();break}
  case'ap':{const n=$('#np').value.trim();if(!n)break;const p={id:uid(),name:n};S.projects.push(p);await put('projects',p);render();break}
  case'rp':{const p=S.projects.find(x=>x.id==id),n=(prompt('Project name:',p.name)||'').trim();if(n){p.name=n;await put('projects',p);render()}break}
  case'dp':{if(!confirm('Delete this project? Past picks are not changed.'))break;S.projects=S.projects.filter(x=>x.id!=id);await del('projects',id);if(P.proj==id)P.proj='';render();break}
  case'ek':{const k=S.picks.find(x=>x.id==id),v=parseFloat(prompt('Quantity picked:',fmt(k.qty)));if(v>0){k.qty=v;await put('picks',k);render()}break}
  case'dk':{if(!confirm('Delete this pick?'))break;S.picks=S.picks.filter(x=>x.id!=id);await del('picks',id);render();break}
  case'cs':copy(tsv());break;
  case'cf':copy(fixed());break;
  case'em':email();break;
  case'bk':{await out(new File([JSON.stringify({v:8,projects:S.projects,items:S.items,picks:S.picks,photos:S.photos})],'box-log-backup-'+today()+'.json',{type:'application/json'}));ls('bk',today());render();break}
  }});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id=='sq'){P.q=t.value;P.only=null;P.qty='1';$('#qt').value='1';$('#g').innerHTML=grid();upd()}
  else if(t.id=='qt'){P.qty=t.value;upd()}
  else if(t.name=='mfr'){const v=t.value.toLowerCase();$('#ml').innerHTML=!v?'':[...new Set(S.items.map(i=>i.mfr))].filter(m=>m.toLowerCase().startsWith(v)).map(m=>`<option value="${esc(m)}">`).join('')}});
document.addEventListener('focusin',e=>{if(e.target.id=='sq'&&P.only){P.only=null;$('#g').innerHTML=grid();upd()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id=='pj'){if(t.value=='+')return go('proj');P.proj=t.value;upd()}
  else if(t.id=='pd')P.date=t.value||today();
  else if(t.id=='bp'){B.proj=t.value;render()}
  else if(t.id=='ba'){B.a=t.value||today();if(B.a>B.b)B.b=B.a;render()}
  else if(t.id=='bb'){B.b=t.value||today();if(B.b<B.a)B.a=B.b;render()}
  else if(t.id=='rf')restore(t.files[0])});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!='visible')return;if(P.date==P.dd)setDate();if(tab=='box')B.a=B.b=today();if(tab=='pick'||tab=='box')render()});
(async()=>{db=await open();for(const s of ST){const a=await all(s);if(s=='photos')a.forEach(p=>S.photos[p.id]=p.data);else S[s]=a}
  P.proj=ls('lp');setDate();render();
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
