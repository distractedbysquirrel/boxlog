<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Box Log</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#9a5b1f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f2ef;--fg:#1d1b18;--card:#fff;--line:#d8d4cc;--ac:#9a5b1f;--mut:#6b655b}
@media(prefers-color-scheme:dark){:root{--bg:#141311;--fg:#ece9e3;--card:#201e1b;--line:#3a3631;--ac:#c4833f;--mut:#a39c90}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:env(safe-area-inset-top) 0 calc(66px + env(safe-area-inset-bottom))}
main{padding:12px;max-width:900px;margin:auto}
input,select,button,.btn{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--card);min-width:0}
button,.btn{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600;text-align:center}
button.g,.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:400}
button:disabled{opacity:.4}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.r{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}.r>*{flex:1 1 auto}.r .n{flex:0 0 auto}
.f{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mut)}.f select,.f input{color:var(--fg);font-size:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 6px}.top h2{margin:0;font-size:21px}
.hp{width:36px;height:36px;border-radius:50%;padding:0;font-size:19px;font-weight:700;flex:0 0 auto;background:var(--card);color:var(--ac);border:2px solid var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:13px;padding:13px 2px;font-weight:400}
.sub{display:flex;gap:4px;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}.sub button{flex:1;background:none;color:var(--mut);font-weight:400;font-size:14px;padding:9px 2px;border-radius:7px}.sub .on{background:var(--ac);color:#fff;font-weight:700}
nav .on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{white-space:nowrap}
tr[data-sel]{cursor:pointer}tr.s{background:color-mix(in srgb,var(--ac) 22%,transparent)}
img.t{width:44px;height:44px;object-fit:cover;border-radius:6px;display:block}img.big{width:120px;max-height:160px;object-fit:contain;border-radius:6px;display:block;margin:6px 0}
.m{color:var(--mut);font-size:14px}.h{opacity:.55}
.bn{background:color-mix(in srgb,var(--ac) 18%,transparent);padding:10px;border-radius:8px;margin:8px 0}
.sw{position:relative}
.w{overflow-x:auto;-webkit-overflow-scrolling:touch}
.w::-webkit-scrollbar{height:8px}.w::-webkit-scrollbar-thumb{background:var(--ac);border-radius:4px}
.sw::before,.sw::after{content:'';position:absolute;top:0;bottom:0;width:40px;pointer-events:none;opacity:0;transition:opacity .2s;display:flex;align-items:center;font-size:34px;font-weight:700;color:var(--ac);z-index:2}
.sw::after{content:'›';right:0;justify-content:flex-end;padding-right:2px;background:linear-gradient(to right,transparent,var(--bg) 75%)}
.sw::before{content:'‹';left:0;padding-left:2px;background:linear-gradient(to left,transparent,var(--bg) 75%)}
.sx.mr .sw::after,.sx.ml .sw::before{opacity:1}
.li span{font-size:17px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;max-width:90vw}
dialog{width:min(92vw,460px);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);max-height:88vh;overflow:auto}
dialog label{display:block;margin:8px 0 2px;font-size:14px}dialog input,dialog select{width:100%}dialog .r select{width:auto}
dialog h3{outline:none}dialog p,dialog li{margin:6px 0}.ver{text-align:right;font-size:11px;color:var(--mut);margin-top:2px}dialog ol{padding-left:22px}
</style></head><body>
<main id="v"></main><nav id="nav"></nav><dialog id="dlg"></dialog><dialog id="dlg2"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VER='0.8.3'; // Version: bump the last digit with every build
const uid=()=>crypto.randomUUID(),fmt=n=>String(+n),today=()=>new Date().toLocaleDateString('en-CA');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)};
const cmp=(a,b)=>String(a??'').localeCompare(String(b??''),undefined,{numeric:true,sensitivity:'base'});
const sortN=a=>[...a].sort((x,y)=>cmp(x.name,y.name));
const itemSort=(x,y)=>cmp(x.category,y.category)||cmp(x.item,y.item)||(x.hist-y.hist)||cmp(x.mfr,y.mfr)||cmp(x.count,y.count)||cmp(x.weight,y.weight);
const cnt=(c,w)=>[c,w].map(v=>String(v??'').trim()).filter(Boolean).join(' x ');
// Data: "projects" store holds the Recipients (store name kept so existing data carries over).
let db,tab='pick',S={projects:[],categories:[],items:[],picks:[],photos:{}},P={q:'',sel:null,qty:'1',only:null,date:'',dd:'',proj:''},B={proj:'',a:'',b:''};
const ST=['projects','categories','items','picks','photos'];
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('boxlog8',2);r.onupgradeneeded=()=>ST.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=db.transaction(s,m),r=f(t);t.oncomplete=()=>ok(r&&r.result);t.onerror=no});
const all=s=>tx(s,'readonly',t=>t.objectStore(s).getAll()),put=(s,o)=>tx(s,'readwrite',t=>t.objectStore(s).put(o)),del=(s,id)=>tx(s,'readwrite',t=>t.objectStore(s).delete(id));
const putAll=(s,a,clear)=>tx(s,'readwrite',t=>{const o=t.objectStore(s);if(clear)o.clear();a.forEach(x=>o.put(x))});
async function load(){S.photos={};for(const s of ST){const a=await all(s);if(s=='photos')a.forEach(p=>S.photos[p.id]=p.data);else S[s]=a}}
const projOK=()=>S.projects.some(p=>p.id==P.proj),lastName=()=>(S.projects.find(p=>p.id==P.proj)||{}).name||'';
const setDate=()=>{P.date=P.dd=today()};
const thumb=id=>id&&S.photos[id]?`<img class="t" src="${S.photos[id]}" alt="">`:'';
const head=t=>`<div class="top"><h2>${t}</h2><button class="hp" data-a="help" aria-label="Help">?</button></div>`;
const wrap=(inner,id)=>`<div class="sx"><div class="sw"><div class="w"${id?` id="${id}"`:''}>${inner}</div></div></div>`;
function hints(){document.querySelectorAll('.sx').forEach(x=>{const w=x.querySelector('.w'),f=()=>{const m=w.scrollWidth-w.clientWidth;x.classList.toggle('o',m>2);x.classList.toggle('mr',w.scrollLeft<m-2);x.classList.toggle('ml',w.scrollLeft>2)};w.onscroll=f;f()})}
addEventListener('resize',hints);
/* ---------- Dialog helper ---------- */
function ask(title,body,btns,foot){const d=$('#dlg2');d.innerHTML=`<form method="dialog"><h3 tabindex="-1" autofocus>${title}</h3>${body}<div class="r">${btns.map(([v,l,c])=>`<button value="${v}" class="${c||''}">${l}</button>`).join('')}</div>${foot?`<div class="ver">${foot}</div>`:''}</form>`;d.returnValue='';d.showModal();
  return new Promise(ok=>d.addEventListener('close',()=>ok(d.returnValue||'cancel'),{once:true}))}
const TABS=[['pick','Picking'],['box','Picked'],['set','Settings']],SUBS=[['items','Items'],['rec','Recipients'],['cat','Categories'],['bak','Backup']];let sub='items';
const HELP={
pick:['Picking',`<p>Use this tab each time you take boxes from the warehouse.</p><ol>
<li><b>Recipient:</b> choose who the boxes are for. The app remembers your last choice. To add a new name, choose “+ Add a recipient…”.</li>
<li><b>Date:</b> it starts on today. Change it if these boxes belong to another day, such as the delivery day. It goes back to today after each save.</li>
<li><b>Search:</b> type part of any word, such as “rice”. The list gets shorter as you type.</li>
<li><b>Tap an item</b> in the list to choose it. It turns highlighted.</li>
<li><b>How many boxes:</b> tap − or +, or type a number. Part of a box is fine, such as 1.5.</li>
<li>Tap <b>Save</b>. The boxes are added to the Picked tab.</li></ol>
<p>If the search finds nothing, tap <b>Add new item</b> to add it to the item list.</p>
<p>If the list is wider than the screen, swipe it sideways to see the rest.</p>`],
box:['Picked',`<p>This tab shows the boxes that were picked, in the order they were saved.</p><ol>
<li>Choose the <b>Recipient</b>.</li>
<li>Set <b>From</b> and <b>To</b> to the dates you want. These are the dates chosen on the Picking tab. Both start on today.</li></ol>
<p>The total number of boxes is shown above the list.</p>
<p><b>Edit</b> lets you fix the number of boxes, the recipient or the date. If the wrong item was picked, tap <b>Delete</b> and pick it again.</p>
<p><b>Copy for spreadsheet:</b> then open Excel or Google Sheets, tap one cell and paste.</p>
<p><b>Copy as fixed width:</b> copies a plain text table to paste into an email or a document.</p>
<p><b>Send as email:</b> prepares a list with photos and opens your email app. In the new message, press and hold where you type the message, choose <b>Paste</b>, add who it goes to, and send.</p>`],
items:['Items',`<p>This is the list of every kind of box in the warehouse. You will find it under Settings.</p>
<p><b>Add item</b> adds a new kind of box.</p>
<p><b>Edit</b> changes an item. Boxes already picked are not changed.</p>
<p><b>Historical</b> hides an item from the Picking search, for example when it is no longer stocked. It stays in this list, faded and marked “historical”. Tap <b>Restore</b> to bring it back.</p>
<p><b>Delete</b> removes an item for good. Boxes already picked keep their details but lose the photo.</p>`],
rec:['Recipients',`<p>Recipients are who the boxes are for. You choose one on the Picking tab.</p>
<p>Type a name and tap <b>Add</b>. You can also <b>Rename</b> or <b>Delete</b> a name. This never changes picks already saved. They keep the name they had.</p>`],
cat:['Categories',`<p>Categories are kinds of items, such as Rice or Canned Fruit. You choose one when you add or edit an item.</p>
<p>Type a name and tap <b>Add</b>. You can also <b>Rename</b> or <b>Delete</b> a name. This never changes items or picks already saved. They keep the name they had.</p>
<p>You can also add a category while adding an item, by choosing <b>New Category…</b> at the bottom of the category list.</p>`],
bak:['Backup',`<p>Everything in this app is stored only on this phone. If the phone clears its browser data, it is gone. A backup file keeps it safe.</p>
<p><b>Share</b> makes one backup file and opens a menu where you can email it or save it to Google Drive, Dropbox and so on. Do this often, and always before handing the app to someone else.</p>
<p><b>Import</b> loads a backup file. You will be asked whether to <b>replace</b> what is in the app or <b>merge</b> (combine) the two.</p>
<p>The backup is a zip file. Inside are spreadsheet files that open in Excel, and a folder of photos.</p>
<p><b>To put the app on your home screen:</b> on iPhone, tap Share, then Add to Home Screen. On Android, tap the menu, then Install app.</p>`]};
function go(t){if(SUBS.some(x=>x[0]==t)){sub=t;t='set'}tab=t;if(t=='box'){B.a=B.b=today();const n=bProjs();if(!n.includes(B.proj))B.proj=n.includes(lastName())?lastName():(n[0]||'')}if(t=='pick'&&P.date==P.dd)setDate();render()}
function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" data-go="${k}">${l}</button>`).join('');
  const old=S.picks.length&&(!ls('bk')||Date.now()-new Date(ls('bk'))>30*864e5);
  $('#v').innerHTML=(old?'<div class="bn">It has been a while since the last backup. Open Settings, then Backup, and tap Share.</div>':'')+(tab=='set'?vSet():{pick:vPick,box:vBox}[tab]());
  if(tab=='pick')drawGrid();else hints()
}
/* ---------- Picking ---------- */
function vPick(){return head('Picking')+`<div class="r"><label class="f">Recipient<select id="pj"><option value="">${S.projects.length?'Choose a recipient…':'No recipients yet'}</option>${sortN(S.projects).map(p=>`<option value="${p.id}" ${p.id==P.proj?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="+">+ Add a recipient…</option></select></label><label class="f n">Date<input type="date" id="pd" value="${P.date}"></label></div>
${projOK()?'':`<div class="bn">${S.projects.length?'Choose who these boxes are for in the Recipient box.':'There are no recipients yet. Add one first.'} <button class="g n" data-go="rec">Add a recipient</button></div>`}
<input id="sq" placeholder="Search items" value="${esc(P.q)}" style="width:100%" autocomplete="off">
<div class="r"><button class="g n" data-a="mn" aria-label="One less">−</button><input id="qt" inputmode="decimal" value="${esc(P.qty)}" style="max-width:90px;text-align:center" aria-label="How many boxes"><button class="g n" data-a="pl" aria-label="One more">+</button><button id="sv" data-a="save">Save</button></div>
${wrap('','g')}`}
function vis(){const q=P.q.trim().toLowerCase();return S.items.filter(i=>!i.hist&&(P.only?i.id==P.only:!q||[i.category,i.item,i.mfr,cnt(i.count,i.weight),i.count,i.weight].some(v=>String(v??'').toLowerCase().includes(q))))}
function grid(){const v=vis();if(P.sel&&!v.some(i=>i.id==P.sel))P.sel=null;
  if(!v.length)return `<p class="m">No items found.</p><button data-a="new">Add new item</button>`;
  return `<table><tr><th>Category<th>Item<th>Manufacturer<th>Count<th>Photo</tr>${v.map(i=>`<tr data-sel="${i.id}" class="${i.id==P.sel?'s':''}"><td>${esc(i.category)}<td>${esc(i.item)}<td>${esc(i.mfr)}<td style="white-space:nowrap">${esc(cnt(i.count,i.weight))}<td>${thumb(i.photo)}</tr>`).join('')}</table>`}
function drawGrid(){const g=$('#g');if(!g)return;g.innerHTML=grid();upd();hints()}
function upd(){const s=$('#sv');if(s)s.disabled=!(P.sel&&projOK()&&+P.qty>0)}
/* ---------- Item form ---------- */
const mfrs=()=>[...new Set(S.items.map(i=>i.mfr).filter(Boolean))];
function dItem(it,pre){const x=it?{...it}:{},d=$('#dlg');
  if(!it&&pre){const l=pre.toLowerCase(),c=S.categories.find(c=>c.name.toLowerCase()==l),m=mfrs().find(m=>m.toLowerCase()==l);if(c)x.category=c.name;else if(m)x.mfr=m;else x.item=pre}
  const cats=sortN(S.categories).map(c=>c.name);if(x.category&&!cats.includes(x.category))cats.push(x.category),cats.sort(cmp);
  d.innerHTML=`<form id="fi"><h3 tabindex="-1" autofocus>${it?'Edit item':'New item'}</h3>
<label>Category</label><select name="category" id="fc" required data-prev="${esc(x.category||'')}"><option value="">Choose a category…</option>${cats.map(c=>`<option value="${esc(c)}" ${c==x.category?'selected':''}>${esc(c)}</option>`).join('')}<option value="+">New Category…</option></select>
<label>Item</label><input name="item" required value="${esc(x.item)}">
<label>Manufacturer</label><input name="mfr" required list="ml" autocomplete="off" value="${esc(x.mfr)}"><datalist id="ml"></datalist>
<label>Item Count (pieces in a box)</label><input name="count" required inputmode="decimal" value="${esc(x.count)}">
<label>Item Weight (one piece, like 8 oz)</label><input name="weight" required value="${esc(x.weight)}">
<label>Photo (optional)</label>${it&&it.photo&&S.photos[it.photo]?`<img class="big" src="${S.photos[it.photo]}" alt=""><p class="m">To use a different photo, choose it here.</p>`:''}<input type="file" name="ph" accept="image/*">
<div class="r"><button type="button" class="g" data-a="cx">Cancel</button><button>Save item</button></div></form>`;
  d.dataset.id=it?it.id:'';d.showModal()}
const shrink=f=>new Promise(ok=>{const i=new Image();i.onload=()=>{const s=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.onerror=()=>ok(null);i.src=URL.createObjectURL(f)});
async function dropPhoto(pid){const ch=S.picks.filter(k=>k.photo==pid);ch.forEach(k=>k.photo=null);if(ch.length)await putAll('picks',ch);delete S.photos[pid];await del('photos',pid)}
document.addEventListener('submit',async e=>{if(e.target.id!='fi')return;e.preventDefault();
  const d=$('#dlg'),id=d.dataset.id,fd=new FormData(e.target),old=S.items.find(i=>i.id==id),o={...(old||{id:uid(),hist:false,photo:null})};
  ['category','item','mfr','count','weight'].forEach(k=>o[k]=String(fd.get(k)||'').trim());
  const f=fd.get('ph');let np=f&&f.size?await shrink(f):null,drop=false;d.close();
  if(old&&old.photo&&S.photos[old.photo]){const cur=`<img class="big" src="${S.photos[old.photo]}" alt="">`;
    if(np){const r=await ask('Is the photo still correct?',`<p>This is the current photo. You chose a new one.</p>${cur}<p>If you use the new photo, past picks of this item will keep their details but lose the old photo.</p>`,[['new','Use the new photo'],['keep','Keep the current photo','g'],['cancel','Cancel','g']]);
      if(r=='cancel')return toast('Nothing was changed');if(r=='keep')np=null;else drop=true}
    else{const r=await ask('Is the photo still correct?',cur,[['yes','Yes'],['no','No','g'],['cancel','Cancel','g']]);
      if(r=='cancel')return toast('Nothing was changed');
      if(r=='no'){for(;;){const r2=await ask('Replace or remove the photo?',`<p>Past picks of this item will keep their details but lose the old photo.</p><label>New photo</label><input type="file" id="nph" accept="image/*">`,[['new','Use the new photo'],['rm','Remove the photo','g'],['cancel','Cancel','g']]);
        if(r2=='cancel')return toast('Nothing was changed');
        if(r2=='new'){const ff=$('#nph').files[0];if(!ff){toast('Choose a photo first');continue}np=await shrink(ff)}break}
        drop=true}}}
  if(drop){await dropPhoto(old.photo);o.photo=null}
  if(np){const pid=uid();S.photos[pid]=np;await put('photos',{id:pid,data:np});o.photo=pid}
  const k=S.items.findIndex(i=>i.id==o.id);k<0?S.items.push(o):S.items[k]=o;await put('items',o);
  if(!id&&tab=='pick'){P.q='';P.only=o.id;P.sel=o.id;P.qty='1'}render()});
/* ---------- Picked ---------- */
const bProjs=()=>[...new Set([...S.projects.map(p=>p.name),...S.picks.map(k=>k.project)])].filter(Boolean).sort(cmp);
const rows=()=>S.picks.filter(k=>k.project==B.proj&&k.pDate>=B.a&&k.pDate<=B.b).sort((x,y)=>String(x.savedAt).localeCompare(String(y.savedAt)));
const range=()=>B.a!=B.b;
const hdr=()=>['Quantity','Category','Item','Manufacturer','Item Count',...(range()?['Date']:[])];
const cells=k=>[fmt(k.qty),k.category,k.item,k.mfr,cnt(k.count,k.weight),...(range()?[k.pDate]:[])].map(v=>String(v??'').replace(/[\t\r\n]+/g,' '));
const tsv=()=>[hdr(),...rows().map(cells)].map(r=>r.join('\t')).join('\n');
const fixed=()=>{const t=[hdr(),...rows().map(cells)],w=t[0].map((_,i)=>Math.max(...t.map(r=>r[i].length)));return t.map(r=>r.map((c,i)=>c.padEnd(w[i])).join('  ').trimEnd()).join('\n')};
const total=r=>+r.reduce((a,k)=>a+k.qty,0).toFixed(4);
function vBox(){const r=rows(),sd=range(),n=bProjs();
  return head('Picked')+`<div class="r"><label class="f">Recipient<select id="bp">${n.length?n.map(x=>`<option value="${esc(x)}" ${x==B.proj?'selected':''}>${esc(x)}</option>`).join(''):'<option value="">No picks yet</option>'}</select></label></div>
<div class="r"><label class="f">From<input type="date" id="ba" value="${B.a}"></label><label class="f">To<input type="date" id="bb" value="${B.b}"></label></div>
<p><b>Total quantity: ${fmt(total(r))}</b> <span class="m">(${r.length} ${r.length==1?'pick':'picks'})</span></p>
<div class="r"><button data-a="cs">Copy for spreadsheet</button><button data-a="cf">Copy as fixed width</button><button data-a="em">Send as email</button></div>
${r.length?wrap(`<table><tr><th>Qty<th>Category<th>Item<th>Manufacturer<th>Count${sd?'<th>Date':''}<th>Photo<th></tr>${r.map(k=>`<tr><td>${fmt(k.qty)}<td>${esc(k.category)}<td>${esc(k.item)}<td>${esc(k.mfr)}<td style="white-space:nowrap">${esc(cnt(k.count,k.weight))}${sd?`<td style="white-space:nowrap">${k.pDate}`:''}<td>${thumb(k.photo)}<td style="white-space:nowrap"><button class="g n" data-a="ek" data-id="${k.id}">Edit</button> <button class="g n" data-a="dk" data-id="${k.id}">Delete</button></tr>`).join('')}</table>`):'<p class="m">No picks for this recipient on these dates.</p>'}`}
async function out(f){if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return true}catch(e){if(e.name=='AbortError')return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.append(a);a.click();a.remove();return true}
const copy=t=>navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Could not copy'));
/* Email: every photo sits in the same portrait box, tall enough for 6 lines of text */
const PW=112,PH=150,LH=25;

/* A real table: when copied out of an email, Excel and Sheets put each value in its own cell (tabs do not survive in email) */
function sheet(r){const td=(v,b)=>`<td style="font-family:Arial,Helvetica,sans-serif;font-size:13px;border:1px solid #bbbbbb;padding:3px 6px;white-space:nowrap${b?';font-weight:bold;background:#eeeeee':''}">${esc(v)}</td>`;

const csvQ=v=>{v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function parseCSV(t){t=t.replace(/^﻿/,'');const R=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}

function normTime(s){s=String(s||'').trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm)?/i);
